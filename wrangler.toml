# Cloudflare Pages 配置：用于部署 blog 项目并绑定点赞 KV 存储
name = "blog"
pages_build_output_dir = "./public"

# 启用 Node.js 兼容层（Functions 运行时需要）
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 点赞计数存储（每篇文章的点赞数）
[[kv_namespaces]]
binding = "blog_like_count"
id = "0220add30f784071aba35304b4b97971"
